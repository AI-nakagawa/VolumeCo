<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <meta name="theme-color" content="#1f4e78">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >
  <meta
    name="apple-mobile-web-app-title"
    content="残量計算"
  >

  <title>コンクリート残量計算</title>
  <link rel="manifest" href="./manifest.webmanifest">

  <style>
    :root {
      --navy: #1f4e78;
      --blue: #2f75b5;
      --light-blue: #d9eaf7;
      --green: #2e7d32;
      --light-green: #e8f5e9;
      --yellow: #fff4c4;
      --red: #c62828;
      --gray: #64748b;
      --light-gray: #f1f5f9;
      --border: #cbd5e1;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: #1e293b;
      background: #eef3f7;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Yu Gothic",
        "Hiragino Kaku Gothic ProN",
        "Segoe UI",
        sans-serif;
      font-size: 16px;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      min-height: 48px;
      padding: 10px 14px;
      border: 0;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:active {
      transform: scale(0.98);
    }

    input,
    select {
      width: 100%;
      min-height: 52px;
      padding: 10px 12px;
      border: 2px solid var(--border);
      border-radius: 10px;
      background: var(--white);
      font-size: 18px;
    }

    input:focus,
    select:focus {
      border-color: var(--blue);
      outline: 3px solid rgba(47, 117, 181, 0.16);
    }

    input[type="number"] {
      text-align: right;
    }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 20;
      padding:
        max(10px, env(safe-area-inset-top))
        12px 10px;
      color: var(--white);
      background: var(--navy);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
    }

    .header-inner {
      max-width: 760px;
      margin: auto;
    }

    .app-title {
      margin: 0;
      font-size: 19px;
    }

    .total-bar {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-top: 9px;
      padding: 9px 13px;
      color: #16324f;
      background: var(--light-green);
      border-radius: 11px;
    }

    .total-label {
      font-weight: 700;
    }

    .total-value {
      color: var(--green);
      font-size: 25px;
      font-weight: 800;
    }

    .tabs {
      position: sticky;
      top: 104px;
      z-index: 15;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      max-width: 760px;
      margin: auto;
      padding: 8px 10px;
      background: #eef3f7;
    }

    .tab-button {
      min-height: 44px;
      padding: 7px 4px;
      color: var(--navy);
      background: var(--white);
      border: 1px solid var(--border);
      font-size: 14px;
    }

    .tab-button.active {
      color: var(--white);
      background: var(--blue);
      border-color: var(--blue);
    }

    main {
      max-width: 760px;
      margin: auto;
      padding: 6px 10px 30px;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    .card {
      margin-bottom: 12px;
      padding: 16px;
      background: var(--white);
      border-radius: 14px;
      box-shadow: 0 2px 7px rgba(15, 23, 42, 0.08);
    }

    .card h2 {
      margin: 0 0 14px;
      padding-bottom: 8px;
      color: var(--navy);
      border-bottom: 2px solid var(--light-blue);
      font-size: 18px;
    }

    .field {
      margin-bottom: 15px;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 700;
    }

    .required::after {
      content: " 必須";
      color: var(--red);
      font-size: 11px;
    }

    .unit-field {
      display: grid;
      grid-template-columns: 1fr 58px;
      gap: 7px;
      align-items: center;
    }

    .unit {
      color: var(--gray);
      text-align: center;
      font-weight: 700;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .notice {
      margin-bottom: 12px;
      padding: 11px 12px;
      border-radius: 10px;
      background: var(--light-blue);
      line-height: 1.6;
      font-size: 14px;
    }

    .message {
      display: none;
      margin-bottom: 12px;
      padding: 12px;
      border-radius: 10px;
      font-weight: 700;
    }

    .message.show {
      display: block;
    }

    .message.info {
      color: #1e4f7a;
      background: var(--light-blue);
    }

    .message.success {
      color: #1b5e20;
      background: var(--light-green);
    }

    .message.error {
      color: #8b1a1a;
      background: #ffebee;
    }

    .button-primary {
      color: var(--white);
      background: var(--blue);
    }

    .button-success {
      color: var(--white);
      background: var(--green);
    }

    .button-secondary {
      color: var(--navy);
      background: var(--light-blue);
    }

    .button-danger {
      color: var(--white);
      background: var(--red);
    }

    .button-neutral {
      color: #334155;
      background: var(--light-gray);
      border: 1px solid var(--border);
    }

    .button-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }

    .button-full {
      width: 100%;
      margin-top: 12px;
    }

    .point-entry {
      padding: 14px;
      background: var(--yellow);
      border: 2px solid #edd269;
      border-radius: 12px;
    }

    .point-list {
      display: grid;
      gap: 10px;
    }

    .point-card {
      padding: 12px;
      background: var(--white);
      border: 1px solid var(--border);
      border-left: 5px solid var(--blue);
      border-radius: 10px;
    }

    .point-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .point-number {
      color: var(--navy);
      font-size: 18px;
      font-weight: 800;
    }

    .point-values {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
      margin-bottom: 8px;
    }

    .point-value {
      padding: 8px;
      background: var(--light-gray);
      border-radius: 8px;
      text-align: center;
    }

    .point-value small {
      display: block;
      margin-bottom: 2px;
      color: var(--gray);
    }

    .calculated-values {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      margin-bottom: 8px;
      font-size: 12px;
    }

    .calculated-values div {
      padding: 7px 3px;
      background: var(--light-blue);
      border-radius: 7px;
      text-align: center;
    }

    .point-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }

    .point-actions button {
      min-height: 42px;
      padding: 6px;
      font-size: 14px;
    }

    .result-total {
      padding: 20px 10px;
      color: var(--green);
      background: var(--light-green);
      border-radius: 12px;
      text-align: center;
    }

    .result-total small {
      display: block;
      color: #355c38;
      font-weight: 700;
    }

    .result-total strong {
      display: block;
      margin-top: 4px;
      font-size: 38px;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    .summary-box {
      padding: 12px 6px;
      background: var(--light-gray);
      border-radius: 9px;
      text-align: center;
    }

    .summary-box small {
      display: block;
      color: var(--gray);
    }

    .summary-box strong {
      display: block;
      margin-top: 4px;
      font-size: 18px;
    }

    .empty {
      padding: 20px;
      color: var(--gray);
      text-align: center;
    }

    .hidden {
      display: none !important;
    }

    .version {
      margin: 16px 0 4px;
      color: var(--gray);
      text-align: center;
      font-size: 12px;
    }

    @media (max-width: 420px) {
      .grid-2 {
        grid-template-columns: 1fr;
        gap: 0;
      }

      .total-value {
        font-size: 22px;
      }

      .calculated-values {
        font-size: 11px;
      }
    }
  </style>
</head>

<body>
  <header class="app-header">
    <div class="header-inner">
      <h1 class="app-title">コンクリート残量計算</h1>

      <div class="total-bar">
        <span class="total-label">合計数量</span>
        <span id="headerTotal" class="total-value">0.000 m³</span>
      </div>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab-button active" data-tab="conditions">
      1. 基本条件
    </button>

    <button class="tab-button" data-tab="points">
      2. 測点入力
    </button>

    <button class="tab-button" data-tab="results">
      3. 計算結果
    </button>
  </nav>

  <main>
    <div id="message" class="message"></div>

    <section id="conditions" class="screen active">
      <div class="card">
        <h2>基本条件</h2>

        <div class="field">
          <label for="method" class="required">計算方式</label>
          <select id="method">
            <option value="勾配で計算">勾配で計算</option>
            <option value="上下幅平均">上下幅平均</option>
          </select>
        </div>

        <div class="field">
          <label for="topWidth" class="required">上幅</label>

          <div class="unit-field">
            <input
              id="topWidth"
              type="number"
              inputmode="decimal"
              step="0.001"
            >
            <span class="unit">m</span>
          </div>
        </div>

        <div id="averageFields" class="hidden">
          <div class="field">
            <label for="bottomWidth" class="required">下幅</label>

            <div class="unit-field">
              <input
                id="bottomWidth"
                type="number"
                inputmode="decimal"
                step="0.001"
              >
              <span class="unit">m</span>
            </div>
          </div>
        </div>

        <div id="slopeFields">
          <div class="grid-2">
            <div class="field">
              <label for="frontSlope" class="required">前勾配 n</label>

              <input
                id="frontSlope"
                type="number"
                inputmode="decimal"
                step="0.001"
              >
            </div>

            <div class="field">
              <label for="rearSlope" class="required">後勾配 n</label>

              <input
                id="rearSlope"
                type="number"
                inputmode="decimal"
                step="0.001"
              >
            </div>
          </div>
        </div>

        <button
          id="toPointsButton"
          class="button-primary button-full"
        >
          次へ：測点入力
        </button>
      </div>
    </section>

    <section id="points" class="screen">
      <div class="notice">
        距離は始点からの累積値を入力してください。
        距離と高さは同じ測点に入力します。
      </div>

      <div class="card">
        <h2 id="pointEntryTitle">測点を追加</h2>

        <div class="point-entry">
          <div class="grid-2">
            <div class="field">
              <label for="pointDistance" class="required">距離</label>

              <div class="unit-field">
                <input
                  id="pointDistance"
                  type="number"
                  inputmode="decimal"
                  step="0.001"
                  placeholder="0.000"
                >
                <span class="unit">m</span>
              </div>
            </div>

            <div class="field">
              <label for="pointHeight" class="required">高さ</label>

              <div class="unit-field">
                <input
                  id="pointHeight"
                  type="number"
                  inputmode="decimal"
                  step="1"
                  placeholder="1000"
                >
                <span class="unit">mm</span>
              </div>
            </div>
          </div>

          <div class="button-row">
            <button
              id="addPointButton"
              class="button-success"
            >
              測点を追加
            </button>

            <button
              id="cancelEditButton"
              class="button-neutral hidden"
            >
              修正を中止
            </button>
          </div>
        </div>
      </div>

      <div class="card">
        <h2>入力済み測点</h2>
        <div id="pointList" class="point-list"></div>
      </div>

      <div class="button-row">
        <button
          id="sampleButton"
          class="button-secondary"
        >
          サンプル読込
        </button>

        <button
          id="toResultsButton"
          class="button-primary"
        >
          計算結果を確認
        </button>
      </div>
    </section>

    <section id="results" class="screen">
      <div class="card">
        <h2>計算結果</h2>

        <div class="result-total">
          <small>合計数量</small>
          <strong id="resultTotal">0.000 m³</strong>
        </div>

        <div class="summary-grid">
          <div class="summary-box">
            <small>測点数</small>
            <strong id="pointCount">0</strong>
          </div>

          <div class="summary-box">
            <small>計算状態</small>
            <strong id="calculationStatus">未入力</strong>
          </div>
        </div>
      </div>

      <div class="card">
        <h2>データ操作</h2>

        <div class="button-row">
          <button
            id="exportCsvButton"
            class="button-primary"
          >
            CSV出力
          </button>

          <button
            id="importCsvButton"
            class="button-secondary"
          >
            CSV読込
          </button>
        </div>

        <input
          id="csvFileInput"
          class="hidden"
          type="file"
          accept=".csv,text/csv"
        >

        <button
          id="newCalculationButton"
          class="button-danger button-full"
        >
          新規計算
        </button>
      </div>

      <div class="version">VolumeCo Version 0.2</div>
    </section>
  </main>

  <script>
    "use strict";

    const APP_VERSION = "0.2";
    const STORAGE_KEY = "volumeco_current";

    let editingPointIndex = null;
    let state = loadState();

    function blankState() {
      return {
        schema_version: "2.0",
        method: "勾配で計算",
        top_width_m: 2,
        bottom_width_m: 2,
        front_slope: 0.5,
        rear_slope: 0,
        points: [],
        updated_at: new Date().toISOString()
      };
    }

    function storedNumber(value, fallback) {
      if (value === undefined) return fallback;
      if (value === null || value === "") return null;

      const number = Number(value);
      return Number.isFinite(number) ? number : fallback;
    }

    function numberOrNull(value) {
      if (value === "" || value === null || value === undefined) {
        return null;
      }

      const number = Number(value);
      return Number.isFinite(number) ? number : null;
    }

    function normalizeState(source = {}) {
      const points = Array.isArray(source.points)
        ? source.points
            .map((point) => ({
              distance_m: numberOrNull(point.distance_m),
              height_mm: numberOrNull(point.height_mm)
            }))
            .filter((point) =>
              point.distance_m !== null &&
              point.height_mm !== null
            )
        : [];

      return {
        schema_version: "2.0",
        method:
          source.method === "上下幅平均"
            ? "上下幅平均"
            : "勾配で計算",
        top_width_m: storedNumber(source.top_width_m, 2),
        bottom_width_m: storedNumber(source.bottom_width_m, 2),
        front_slope: storedNumber(source.front_slope, 0.5),
        rear_slope: storedNumber(source.rear_slope, 0),
        points,
        updated_at:
          source.updated_at || new Date().toISOString()
      };
    }

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);

        if (!saved) {
          return blankState();
        }

        return normalizeState(JSON.parse(saved));
      } catch (error) {
        return blankState();
      }
    }

    function saveState() {
      state.updated_at = new Date().toISOString();

      try {
        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify(state)
        );
      } catch (error) {
        console.log("端末内保存に失敗しました。");
      }
    }

    function formatNumber(value, decimals = 3) {
      if (!Number.isFinite(value)) return "-";
      return value.toFixed(decimals);
    }

    function showMessage(text, type = "info") {
      const message = document.getElementById("message");

      message.textContent = text;
      message.className = `message show ${type}`;

      window.clearTimeout(showMessage.timer);

      showMessage.timer = window.setTimeout(() => {
        message.className = "message";
      }, 4000);
    }

    function showTab(tabId) {
      document.querySelectorAll(".screen").forEach((screen) => {
        screen.classList.toggle(
          "active",
          screen.id === tabId
        );
      });

      document.querySelectorAll(".tab-button").forEach((button) => {
        button.classList.toggle(
          "active",
          button.dataset.tab === tabId
        );
      });

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

      if (tabId === "points") {
        window.setTimeout(() => {
          document.getElementById("pointDistance").focus();
        }, 200);
      }
    }

    function updateMethodFields() {
      const method = document.getElementById("method").value;

      document
        .getElementById("averageFields")
        .classList.toggle(
          "hidden",
          method !== "上下幅平均"
        );

      document
        .getElementById("slopeFields")
        .classList.toggle(
          "hidden",
          method === "上下幅平均"
        );
    }

    function fillFormFromState() {
      document.getElementById("method").value =
        state.method;

      document.getElementById("topWidth").value =
        state.top_width_m ?? "";

      document.getElementById("bottomWidth").value =
        state.bottom_width_m ?? "";

      document.getElementById("frontSlope").value =
        state.front_slope ?? "";

      document.getElementById("rearSlope").value =
        state.rear_slope ?? "";

      updateMethodFields();
    }

    function updateStateFromForm() {
      state.method =
        document.getElementById("method").value;

      state.top_width_m = numberOrNull(
        document.getElementById("topWidth").value
      );

      state.bottom_width_m = numberOrNull(
        document.getElementById("bottomWidth").value
      );

      state.front_slope = numberOrNull(
        document.getElementById("frontSlope").value
      );

      state.rear_slope = numberOrNull(
        document.getElementById("rearSlope").value
      );

      saveState();
    }

    function validateBasicConditions() {
      if (state.top_width_m === null) {
        return "上幅を入力してください";
      }

      if (state.method === "上下幅平均") {
        if (state.bottom_width_m === null) {
          return "上幅と下幅を入力してください";
        }
      } else {
        if (
          state.front_slope === null ||
          state.rear_slope === null
        ) {
          return "上幅と前後勾配を入力してください";
        }
      }

      return "";
    }

    function calculate() {
      const basicError = validateBasicConditions();

      if (basicError) {
        return {
          error: basicError,
          total: 0,
          rows: []
        };
      }

      const rows = [];
      let total = 0;

      state.points.forEach((point, index) => {
        const heightM = point.height_mm / 1000;

        let calculatedWidth;

        if (state.method === "上下幅平均") {
          calculatedWidth =
            (state.top_width_m + state.bottom_width_m) / 2;
        } else {
          calculatedWidth =
            state.top_width_m +
            (
              state.front_slope +
              state.rear_slope
            ) *
            heightM;
        }

        let area;

        if (state.method === "上下幅平均") {
          area = calculatedWidth * heightM;
        } else {
          area =
            (
              (
                state.top_width_m +
                calculatedWidth
              ) /
              2
            ) *
            heightM;
        }

        let section = 0;

        if (index > 0) {
          const previousRow = rows[index - 1];
          const previousPoint = state.points[index - 1];

          section =
            (
              (
                previousRow.area_m2 +
                area
              ) /
              2
            ) *
            (
              point.distance_m -
              previousPoint.distance_m
            );
        }

        total += section;

        rows.push({
          distance_m: point.distance_m,
          height_mm: point.height_mm,
          calc_width_m: calculatedWidth,
          area_m2: area,
          section_m3: section
        });
      });

      let error = "";

      if (state.points.length === 0) {
        error = "測点を追加してください";
      } else if (state.points.length < 2) {
        error = "2測点以上入力してください";
      }

      return {
        error,
        total,
        rows
      };
    }

    function renderCalculation(calculation) {
      const totalText =
        `${formatNumber(calculation.total)} m³`;

      document.getElementById("headerTotal").textContent =
        totalText;

      document.getElementById("resultTotal").textContent =
        totalText;

      document.getElementById("pointCount").textContent =
        state.points.length;

      const status =
        document.getElementById("calculationStatus");

      if (state.points.length === 0) {
        status.textContent = "未入力";
        status.style.color = "#64748b";
      } else if (calculation.error) {
        status.textContent = "入力確認";
        status.style.color = "#c62828";
      } else {
        status.textContent = "計算完了";
        status.style.color = "#2e7d32";
      }
    }

    function renderPoints(calculation) {
      const pointList =
        document.getElementById("pointList");

      if (state.points.length === 0) {
        pointList.innerHTML =
          '<div class="empty">' +
          '測点はまだ入力されていません。' +
          '</div>';

        return;
      }

      pointList.innerHTML = state.points
        .map((point, index) => {
          const row = calculation.rows[index];

          const calculatedWidth = row
            ? formatNumber(row.calc_width_m)
            : "-";

          const area = row
            ? formatNumber(row.area_m2)
            : "-";

          const section = row
            ? formatNumber(row.section_m3)
            : "-";

          return `
            <article class="point-card">
              <div class="point-card-header">
                <span class="point-number">
                  No.${index + 1}
                </span>

                <strong>${section} m³</strong>
              </div>

              <div class="point-values">
                <div class="point-value">
                  <small>距離</small>
                  <strong>
                    ${formatNumber(point.distance_m)} m
                  </strong>
                </div>

                <div class="point-value">
                  <small>高さ</small>
                  <strong>
                    ${formatNumber(point.height_mm, 0)} mm
                  </strong>
                </div>
              </div>

              <div class="calculated-values">
                <div>
                  計算幅<br>
                  <strong>${calculatedWidth}</strong>
                </div>

                <div>
                  断面積<br>
                  <strong>${area}</strong>
                </div>

                <div>
                  区間<br>
                  <strong>${section}</strong>
                </div>
              </div>

              <div class="point-actions">
                <button
                  class="button-secondary"
                  data-edit-point="${index}"
                >
                  修正
                </button>

                <button
                  class="button-danger"
                  data-delete-point="${index}"
                >
                  削除
                </button>
              </div>
            </article>
          `;
        })
        .join("");

      pointList
        .querySelectorAll("[data-edit-point]")
        .forEach((button) => {
          button.addEventListener("click", () => {
            startPointEdit(
              Number(button.dataset.editPoint)
            );
          });
        });

      pointList
        .querySelectorAll("[data-delete-point]")
        .forEach((button) => {
          button.addEventListener("click", () => {
            deletePoint(
              Number(button.dataset.deletePoint)
            );
          });
        });
    }

    function renderAll() {
      const calculation = calculate();

      renderCalculation(calculation);
      renderPoints(calculation);
    }

    function validatePoint(
      distance,
      height,
      replaceIndex = null
    ) {
      if (distance === null || height === null) {
        return "距離と高さを同じ測点に入力してください";
      }

      if (distance < 0) {
        return "距離は0以上で入力してください";
      }

      if (height < 0) {
        return "高さは0以上で入力してください";
      }

      const testPoints = state.points.map((point) => ({
        ...point
      }));

      const newPoint = {
        distance_m: distance,
        height_mm: height
      };

      if (replaceIndex === null) {
        testPoints.push(newPoint);
      } else {
        testPoints[replaceIndex] = newPoint;
      }

      for (let index = 1; index < testPoints.length; index++) {
        if (
          testPoints[index].distance_m <=
          testPoints[index - 1].distance_m
        ) {
          return "距離は前の測点より大きくしてください";
        }
      }

      return "";
    }

    function resetPointEditor(clearHeight = false) {
      editingPointIndex = null;

      document.getElementById("pointEntryTitle").textContent =
        "測点を追加";

      document.getElementById("addPointButton").textContent =
        "測点を追加";

      document
        .getElementById("cancelEditButton")
        .classList.add("hidden");

      document.getElementById("pointDistance").value = "";

      if (clearHeight) {
        document.getElementById("pointHeight").value = "";
      }
    }

    function addOrUpdatePoint() {
      updateStateFromForm();

      const distanceInput =
        document.getElementById("pointDistance");

      const heightInput =
        document.getElementById("pointHeight");

      const distance =
        numberOrNull(distanceInput.value);

      const height =
        numberOrNull(heightInput.value);

      const error = validatePoint(
        distance,
        height,
        editingPointIndex
      );

      if (error) {
        showMessage(error, "error");
        return;
      }

      const point = {
        distance_m: distance,
        height_mm: height
      };

      if (editingPointIndex === null) {
        state.points.push(point);
        showMessage("測点を追加しました", "success");
      } else {
        state.points[editingPointIndex] = point;
        showMessage("測点を修正しました", "success");
      }

      saveState();
      resetPointEditor(false);

      heightInput.value = height;
      distanceInput.focus();

      renderAll();
    }

    function startPointEdit(index) {
      const point = state.points[index];

      editingPointIndex = index;

      document.getElementById("pointDistance").value =
        point.distance_m;

      document.getElementById("pointHeight").value =
        point.height_mm;

      document.getElementById("pointEntryTitle").textContent =
        `測点No.${index + 1}を修正`;

      document.getElementById("addPointButton").textContent =
        "修正内容を保存";

      document
        .getElementById("cancelEditButton")
        .classList.remove("hidden");

      document.getElementById("pointDistance").focus();
    }

    function deletePoint(index) {
      if (
        !confirm(
          `測点No.${index + 1}を削除してよろしいですか？`
        )
      ) {
        return;
      }

      state.points.splice(index, 1);

      resetPointEditor(true);
      saveState();
      renderAll();

      showMessage("測点を削除しました", "success");
    }

    function loadSample() {
      if (
        state.points.length > 0 &&
        !confirm(
          "現在の測点をサンプルデータに置き換えますか？"
        )
      ) {
        return;
      }

      state = {
        ...blankState(),
        method: "勾配で計算",
        top_width_m: 2,
        bottom_width_m: 2,
        front_slope: 0.5,
        rear_slope: 0,
        points: [
          { distance_m: 0, height_mm: 1000 },
          { distance_m: 2, height_mm: 1000 },
          { distance_m: 4, height_mm: 1000 },
          { distance_m: 6, height_mm: 1000 },
          { distance_m: 8, height_mm: 1000 }
        ]
      };

      fillFormFromState();
      resetPointEditor(true);
      saveState();
      renderAll();

      showMessage(
        "確認用サンプルを読み込みました",
        "success"
      );
    }

    function newCalculation() {
      if (
        state.points.length > 0 &&
        !confirm(
          "現在の入力内容を消去して、新規計算を始めますか？"
        )
      ) {
        return;
      }

      state = blankState();

      fillFormFromState();
      resetPointEditor(true);
      saveState();
      renderAll();
      showTab("conditions");

      showMessage("新規計算を開始しました", "success");
    }

    function csvEscape(value) {
      const text = String(value ?? "");

      if (
        text.includes(",") ||
        text.includes('"') ||
        text.includes("\n")
      ) {
        return `"${text.replace(/"/g, '""')}"`;
      }

      return text;
    }

    function fileTimestamp() {
      const now = new Date();

      const date =
        now.getFullYear() +
        String(now.getMonth() + 1).padStart(2, "0") +
        String(now.getDate()).padStart(2, "0");

      const time =
        String(now.getHours()).padStart(2, "0") +
        String(now.getMinutes()).padStart(2, "0") +
        String(now.getSeconds()).padStart(2, "0");

      return `${date}_${time}`;
    }

    function exportCsv() {
      updateStateFromForm();

      const calculation = calculate();

      if (calculation.error) {
        showMessage(calculation.error, "error");
        return;
      }

      const headers = [
        "schema_version",
        "method",
        "top_width_m",
        "bottom_width_m",
        "front_slope",
        "rear_slope",
        "point_no",
        "distance_m",
        "height_mm",
        "calc_width_m",
        "area_m2",
        "section_m3",
        "total_m3",
        "updated_at"
      ];

      const updatedAt = new Date().toISOString();

      const rows = calculation.rows.map((row, index) => [
        state.schema_version,
        state.method,
        state.top_width_m,
        state.bottom_width_m ?? "",
        state.front_slope ?? "",
        state.rear_slope ?? "",
        index + 1,
        row.distance_m,
        row.height_mm,
        row.calc_width_m,
        row.area_m2,
        row.section_m3,
        calculation.total,
        updatedAt
      ]);

      const csv = [
        headers.map(csvEscape).join(","),
        ...rows.map((row) =>
          row.map(csvEscape).join(",")
        )
      ].join("\r\n");

      const blob = new Blob(
        ["\ufeff" + csv],
        {
          type: "text/csv;charset=utf-8"
        }
      );

      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");

      link.href = url;
      link.download =
        `VolumeCo_${fileTimestamp()}.csv`;

      document.body.appendChild(link);
      link.click();
      link.remove();

      URL.revokeObjectURL(url);

      showMessage("CSVを出力しました", "success");
    }

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let field = "";
      let quoted = false;

      const source = text.replace(/^\ufeff/, "");

      for (
        let index = 0;
        index < source.length;
        index++
      ) {
        const character = source[index];

        if (quoted) {
          if (
            character === '"' &&
            source[index + 1] === '"'
          ) {
            field += '"';
            index++;
          } else if (character === '"') {
            quoted = false;
          } else {
            field += character;
          }
        } else if (character === '"') {
          quoted = true;
        } else if (character === ",") {
          row.push(field);
          field = "";
        } else if (character === "\n") {
          row.push(field.replace(/\r$/, ""));
          rows.push(row);
          row = [];
          field = "";
        } else {
          field += character;
        }
      }

      row.push(field.replace(/\r$/, ""));

      if (row.some((value) => value !== "")) {
        rows.push(row);
      }

      return rows;
    }

    async function importCsv(file) {
      try {
        const text = await file.text();
        const rows = parseCsv(text);

        if (rows.length < 2) {
          throw new Error("CSVデータがありません");
        }

        const headers = rows[0];
        const dataRows = rows
          .slice(1)
          .filter((row) => row.length > 1);

        const column = (name) =>
          headers.indexOf(name);

        const required = [
          "method",
          "top_width_m",
          "distance_m",
          "height_mm"
        ];

        if (
          required.some((name) => column(name) < 0)
        ) {
          throw new Error(
            "対応していないCSV形式です"
          );
        }

        const value = (row, name) =>
          row[column(name)] ?? "";

        const firstRow = dataRows[0];

        const importedPoints = dataRows
          .map((row, index) => ({
            point_no:
              numberOrNull(value(row, "point_no")) ??
              index + 1,
            distance_m:
              numberOrNull(value(row, "distance_m")),
            height_mm:
              numberOrNull(value(row, "height_mm"))
          }))
          .filter((point) =>
            point.distance_m !== null &&
            point.height_mm !== null
          )
          .sort((a, b) => a.point_no - b.point_no)
          .map((point) => ({
            distance_m: point.distance_m,
            height_mm: point.height_mm
          }));

        for (
          let index = 1;
          index < importedPoints.length;
          index++
        ) {
          if (
            importedPoints[index].distance_m <=
            importedPoints[index - 1].distance_m
          ) {
            throw new Error(
              "CSVの距離が昇順になっていません"
            );
          }
        }

        state = normalizeState({
          method: value(firstRow, "method"),
          top_width_m:
            numberOrNull(
              value(firstRow, "top_width_m")
            ),
          bottom_width_m:
            numberOrNull(
              value(firstRow, "bottom_width_m")
            ),
          front_slope:
            numberOrNull(
              value(firstRow, "front_slope")
            ),
          rear_slope:
            numberOrNull(
              value(firstRow, "rear_slope")
            ),
          points: importedPoints
        });

        fillFormFromState();
        resetPointEditor(true);
        saveState();
        renderAll();
        showTab("results");

        showMessage(
          "CSVからデータを読み込みました",
          "success"
        );
      } catch (error) {
        showMessage(
          error.message ||
            "CSVを読み込めませんでした",
          "error"
        );
      } finally {
        document.getElementById(
          "csvFileInput"
        ).value = "";
      }
    }

    document
      .querySelectorAll(".tab-button")
      .forEach((button) => {
        button.addEventListener("click", () => {
          showTab(button.dataset.tab);
        });
      });

    [
      "method",
      "topWidth",
      "bottomWidth",
      "frontSlope",
      "rearSlope"
    ].forEach((id) => {
      const element = document.getElementById(id);

      element.addEventListener("input", () => {
        updateStateFromForm();
        updateMethodFields();
        renderAll();
      });

      element.addEventListener("change", () => {
        updateStateFromForm();
        updateMethodFields();
        renderAll();
      });
    });

    document
      .getElementById("toPointsButton")
      .addEventListener("click", () => {
        updateStateFromForm();

        const error = validateBasicConditions();

        if (error) {
          showMessage(error, "error");
          return;
        }

        showTab("points");
      });

    document
      .getElementById("toResultsButton")
      .addEventListener("click", () => {
        updateStateFromForm();
        renderAll();
        showTab("results");
      });

    document
      .getElementById("addPointButton")
      .addEventListener(
        "click",
        addOrUpdatePoint
      );

    document
      .getElementById("cancelEditButton")
      .addEventListener("click", () => {
        resetPointEditor(true);
      });

    document
      .getElementById("sampleButton")
      .addEventListener(
        "click",
        loadSample
      );

    document
      .getElementById("exportCsvButton")
      .addEventListener(
        "click",
        exportCsv
      );

    document
      .getElementById("importCsvButton")
      .addEventListener("click", () => {
        document.getElementById(
          "csvFileInput"
        ).click();
      });

    document
      .getElementById("csvFileInput")
      .addEventListener("change", (event) => {
        const file = event.target.files[0];

        if (file) {
          importCsv(file);
        }
      });

    document
      .getElementById("newCalculationButton")
      .addEventListener(
        "click",
        newCalculation
      );

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("./sw.js")
          .catch((error) => {
            console.log(
              "Service Worker登録エラー",
              error
            );
          });
      });
    }

    fillFormFromState();
    renderAll();
  </script>
</body>
</html>
