<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17365d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">

  <title>VolumeCo</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg">
  <link rel="apple-touch-icon" href="./icon.svg">

  <style>
    :root {
      --navy: #17365d;
      --blue: #0070c0;
      --light-blue: #eaf4fb;
      --border: #ccd5df;
      --background: #f3f5f7;
      --text: #1f2933;
      --muted: #64748b;
      --danger: #c00000;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding-bottom: calc(30px + env(safe-area-inset-bottom));
      background: var(--background);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
      touch-action: manipulation;
    }

    header {
      padding: calc(16px + env(safe-area-inset-top)) 18px 17px;
      background: var(--navy);
      color: var(--white);
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      max-width: 720px;
      margin: 0 auto;
    }

    h1 {
      margin: 0;
      font-size: 27px;
      line-height: 1.2;
    }

    .subtitle {
      margin: 4px 0 0;
      font-size: 14px;
      opacity: 0.9;
    }

    .version {
      white-space: nowrap;
      font-size: 12px;
      opacity: 0.85;
    }

    main {
      width: min(100%, 720px);
      margin: 0 auto;
      padding: 14px;
    }

    .card {
      margin-bottom: 14px;
      padding: 17px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: var(--white);
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.05);
    }

    h2 {
      margin: 0 0 16px;
      color: var(--navy);
      font-size: 20px;
    }

    .grid,
    .sub-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 13px;
    }

    .sub-grid {
      grid-column: 1 / -1;
    }

    .field {
      min-width: 0;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 15px;
      font-weight: 700;
    }

    input,
    select {
      width: 100%;
      min-height: 62px;
      padding: 10px 12px;
      border: 2px solid var(--border);
      border-radius: 11px;
      outline: none;
      background: var(--white);
      color: var(--text);
      font-size: 22px;
      text-align: right;
    }

    select {
      min-height: 76px;
      font-size: 19px;
      font-weight: 700;
      text-align: left;
    }

    input:focus,
    select:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(0, 112, 192, 0.14);
    }

    .unit-wrap {
      position: relative;
    }

    .unit-wrap input {
      padding-right: 43px;
    }

    .unit {
      position: absolute;
      top: 50%;
      right: 13px;
      transform: translateY(-50%);
      color: var(--muted);
      font-weight: 700;
      pointer-events: none;
    }

    .notice {
      grid-column: 1 / -1;
      margin: 0 0 15px;
      padding: 12px;
      border-radius: 10px;
      background: var(--light-blue);
      color: #174b73;
      font-size: 14px;
      line-height: 1.6;
    }

    .method-notice {
      margin: 0;
    }

    .result-card {
      border: none;
      background: linear-gradient(135deg, #17365d, #24598d);
      color: var(--white);
      text-align: center;
    }

    .result-label {
      margin-bottom: 5px;
      font-size: 15px;
      opacity: 0.9;
    }

    .result-value {
      font-size: clamp(42px, 12vw, 62px);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -1px;
    }

    .result-unit {
      margin-left: 5px;
      font-size: 22px;
      font-weight: 700;
    }

    .result-status {
      min-height: 22px;
      margin-top: 10px;
      font-size: 14px;
    }

    .result-status.ok {
      color: #d8f8df;
    }

    .result-status.warning {
      color: #ffe5a8;
    }

    .button {
      width: 100%;
      min-height: 58px;
      padding: 11px 14px;
      border: 0;
      border-radius: 11px;
      cursor: pointer;
      font-size: 17px;
      font-weight: 800;
    }

    .button.primary {
      background: var(--blue);
      color: var(--white);
    }

    .button.secondary {
      background: #e6ebf0;
      color: var(--text);
    }

    .button.danger {
      border: 1px solid #edb5b5;
      background: #fff0f0;
      color: var(--danger);
    }

    .button:active {
      transform: scale(0.985);
    }

    .button-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 14px;
    }

    .button-row.three {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .error {
      min-height: 22px;
      margin-top: 10px;
      color: var(--danger);
      font-size: 14px;
      font-weight: 700;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 13px;
    }

    .section-title h2 {
      margin: 0;
    }

    .count {
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }

    .point-list {
      display: grid;
      gap: 11px;
    }

    .point-card {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .point-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      background: #eef2f6;
    }

    .point-number {
      color: var(--navy);
      font-weight: 800;
    }

    .point-data {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      padding: 13px;
    }

    .point-value {
      min-width: 0;
    }

    .point-value small {
      display: block;
      margin-bottom: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    .point-value strong {
      display: block;
      overflow-wrap: anywhere;
      font-size: 17px;
    }

    .point-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 0 13px 13px;
    }

    .small-button {
      min-height: 47px;
      border: 0;
      border-radius: 9px;
      cursor: pointer;
      font-weight: 800;
    }

    .edit-button {
      background: #e6f2fb;
      color: #005a9e;
    }

    .delete-button {
      background: #fff0f0;
      color: var(--danger);
    }

    .empty {
      padding: 20px 10px;
      color: var(--muted);
      line-height: 1.6;
      text-align: center;
    }

    .hidden {
      display: none !important;
    }

    .toast {
      position: fixed;
      z-index: 100;
      bottom: calc(22px + env(safe-area-inset-bottom));
      left: 50%;
      max-width: calc(100% - 30px);
      padding: 12px 18px;
      border-radius: 100px;
      background: rgba(20, 30, 40, 0.94);
      color: white;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%) translateY(20px);
      transition: 0.2s;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 520px) {
      main {
        padding: 11px;
      }

      .card {
        padding: 15px;
      }

      .button-row.three {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="header-inner">
      <div>
        <h1>VolumeCo</h1>
        <p class="subtitle">コンクリート残量計算</p>
      </div>
      <div class="version">Version 0.4</div>
    </div>
  </header>

  <main>
    <section class="card">
      <h2>基本条件</h2>

      <div class="grid">
        <div class="field full">
          <label for="calculationMethod">計算方式</label>
          <select id="calculationMethod">
            <option value="勾配で計算">勾配で計算</option>
            <option value="上下幅平均">上下幅平均</option>
          </select>
        </div>

        <div id="slopeFields" class="sub-grid">
          <div class="field full">
            <label for="slopeTopWidth">上幅</label>
            <div class="unit-wrap">
              <input
                id="slopeTopWidth"
                type="number"
                inputmode="decimal"
                step="any"
              >
              <span class="unit">m</span>
            </div>
          </div>

          <div class="field">
            <label for="frontSlope">前勾配</label>
            <div class="unit-wrap">
              <input
                id="frontSlope"
                type="number"
                inputmode="decimal"
                step="any"
              >
              <span class="unit">n</span>
            </div>
          </div>

          <div class="field">
            <label for="rearSlope">後勾配</label>
            <div class="unit-wrap">
              <input
                id="rearSlope"
                type="number"
                inputmode="decimal"
                step="any"
              >
              <span class="unit">n</span>
            </div>
          </div>
        </div>

        <p id="averageMethodNotice" class="notice method-notice hidden">
          上下幅平均では、上幅と下幅を測点ごとに入力します。
          前回入力した幅は次の測点へ自動で引き継がれます。
        </p>
      </div>
    </section>

    <section class="card result-card">
      <div class="result-label">合計数量</div>
      <div>
        <span id="totalValue" class="result-value">0.000</span>
        <span class="result-unit">m³</span>
      </div>
      <div id="resultStatus" class="result-status warning">
        2測点以上入力してください
      </div>
    </section>

    <section class="card">
      <h2>測点入力</h2>

      <p class="notice">
        区間長は直前の測点からの長さです。1測点目は「0」、
        2測点目以降は各区間の長さを入力してください。
      </p>

      <form id="pointForm">
        <div class="grid">
          <div class="field">
            <label for="sectionLength">区間長</label>
            <div class="unit-wrap">
              <input
                id="sectionLength"
                type="number"
                inputmode="decimal"
                step="any"
                required
              >
              <span class="unit">m</span>
            </div>
          </div>

          <div class="field">
            <label for="heightMm">高さ</label>
            <div class="unit-wrap">
              <input
                id="heightMm"
                type="number"
                inputmode="decimal"
                step="any"
                required
              >
              <span class="unit">mm</span>
            </div>
          </div>

          <div id="pointWidthFields" class="sub-grid hidden">
            <div class="field">
              <label for="pointTopWidth">上幅</label>
              <div class="unit-wrap">
                <input
                  id="pointTopWidth"
                  type="number"
                  inputmode="decimal"
                  step="any"
                >
                <span class="unit">m</span>
              </div>
            </div>

            <div class="field">
              <label for="pointBottomWidth">下幅</label>
              <div class="unit-wrap">
                <input
                  id="pointBottomWidth"
                  type="number"
                  inputmode="decimal"
                  step="any"
                >
                <span class="unit">m</span>
              </div>
            </div>
          </div>
        </div>

        <div class="button-row">
          <button id="pointSubmitButton" class="button primary" type="submit">
            測点を追加
          </button>

          <button
            id="cancelEditButton"
            class="button secondary hidden"
            type="button"
          >
            編集を中止
          </button>
        </div>

        <div id="pointError" class="error"></div>
      </form>
    </section>

    <section class="card">
      <div class="section-title">
        <h2>測点一覧</h2>
        <div id="pointCount" class="count">0測点</div>
      </div>

      <div id="pointList" class="point-list"></div>
    </section>

    <section class="card">
      <h2>データ操作</h2>

      <div class="button-row three">
        <button id="csvExportButton" class="button primary" type="button">
          CSV出力
        </button>

        <button id="csvImportButton" class="button secondary" type="button">
          CSV読込
        </button>

        <button id="newCalculationButton" class="button danger" type="button">
          新規計算
        </button>
      </div>

      <input
        id="csvFileInput"
        class="hidden"
        type="file"
        accept=".csv,text/csv"
      >
    </section>
  </main>

  <div id="toast" class="toast"></div>

  <script>
    "use strict";

    const APP_VERSION = "0.4";
    const STORAGE_KEY = "volumeco_current_v04";

    const elements = {
      calculationMethod: document.getElementById("calculationMethod"),
      slopeFields: document.getElementById("slopeFields"),
      averageMethodNotice:
        document.getElementById("averageMethodNotice"),

      slopeTopWidth: document.getElementById("slopeTopWidth"),
      frontSlope: document.getElementById("frontSlope"),
      rearSlope: document.getElementById("rearSlope"),

      totalValue: document.getElementById("totalValue"),
      resultStatus: document.getElementById("resultStatus"),

      pointForm: document.getElementById("pointForm"),
      sectionLength: document.getElementById("sectionLength"),
      heightMm: document.getElementById("heightMm"),
      pointWidthFields: document.getElementById("pointWidthFields"),
      pointTopWidth: document.getElementById("pointTopWidth"),
      pointBottomWidth: document.getElementById("pointBottomWidth"),
      pointSubmitButton:
        document.getElementById("pointSubmitButton"),
      cancelEditButton:
        document.getElementById("cancelEditButton"),
      pointError: document.getElementById("pointError"),

      pointCount: document.getElementById("pointCount"),
      pointList: document.getElementById("pointList"),

      csvExportButton:
        document.getElementById("csvExportButton"),
      csvImportButton:
        document.getElementById("csvImportButton"),
      newCalculationButton:
        document.getElementById("newCalculationButton"),
      csvFileInput:
        document.getElementById("csvFileInput"),

      toast: document.getElementById("toast")
    };

    function createInitialState(includeSample = true) {
      return {
        version: APP_VERSION,

        conditions: {
          calc_method: "勾配で計算",
          slope_top_width_m: 2,
          front_slope_n: 0.5,
          rear_slope_n: 0
        },

        points: includeSample
          ? [
              {
                section_length_m: 0,
                height_mm: 1000,
                point_top_width_m: 2,
                point_bottom_width_m: 2
              },
              {
                section_length_m: 2,
                height_mm: 1000,
                point_top_width_m: 2,
                point_bottom_width_m: 2
              },
              {
                section_length_m: 2,
                height_mm: 1000,
                point_top_width_m: 2,
                point_bottom_width_m: 2
              },
              {
                section_length_m: 2,
                height_mm: 1000,
                point_top_width_m: 2,
                point_bottom_width_m: 2
              },
              {
                section_length_m: 2,
                height_mm: 1000,
                point_top_width_m: 2,
                point_bottom_width_m: 2
              }
            ]
          : [],

        updated_at: new Date().toISOString()
      };
    }

    function numberOrNull(value) {
      if (
        value === null ||
        value === undefined ||
        value === ""
      ) {
        return null;
      }

      const number = Number(value);

      return Number.isFinite(number) ? number : null;
    }

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);

        if (!saved) {
          return createInitialState(true);
        }

        const parsed = JSON.parse(saved);

        if (
          !parsed ||
          !parsed.conditions ||
          !Array.isArray(parsed.points)
        ) {
          return createInitialState(true);
        }

        return {
          version: APP_VERSION,

          conditions: {
            calc_method:
              parsed.conditions.calc_method === "上下幅平均"
                ? "上下幅平均"
                : "勾配で計算",

            slope_top_width_m:
              numberOrNull(
                parsed.conditions.slope_top_width_m
              ),

            front_slope_n:
              numberOrNull(
                parsed.conditions.front_slope_n
              ),

            rear_slope_n:
              numberOrNull(
                parsed.conditions.rear_slope_n
              )
          },

          points: parsed.points.map(point => ({
            section_length_m:
              numberOrNull(point.section_length_m),

            height_mm:
              numberOrNull(point.height_mm),

            point_top_width_m:
              numberOrNull(point.point_top_width_m),

            point_bottom_width_m:
              numberOrNull(point.point_bottom_width_m)
          })),

          updated_at:
            parsed.updated_at || new Date().toISOString()
        };
      } catch (error) {
        console.error(error);
        return createInitialState(true);
      }
    }

    let state = loadState();
    let editingIndex = null;
    let toastTimer = null;

    function isAverageMethod() {
      return state.conditions.calc_method === "上下幅平均";
    }

    function fixed(value, digits = 3) {
      return Number.isFinite(value)
        ? value.toFixed(digits)
        : "－";
    }

    function saveState() {
      state.updated_at = new Date().toISOString();

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(state)
      );
    }

    function showToast(message) {
      clearTimeout(toastTimer);

      elements.toast.textContent = message;
      elements.toast.classList.add("show");

      toastTimer = setTimeout(() => {
        elements.toast.classList.remove("show");
      }, 1800);
    }

    function getLastPoint() {
      if (state.points.length === 0) {
        return null;
      }

      return state.points[state.points.length - 1];
    }

    function fillInheritedWidths(force = false) {
      if (!isAverageMethod()) {
        return;
      }

      const lastPoint = getLastPoint();

      if (!lastPoint) {
        return;
      }

      if (
        force ||
        elements.pointTopWidth.value === ""
      ) {
        elements.pointTopWidth.value =
          lastPoint.point_top_width_m ?? "";
      }

      if (
        force ||
        elements.pointBottomWidth.value === ""
      ) {
        elements.pointBottomWidth.value =
          lastPoint.point_bottom_width_m ?? "";
      }
    }

    function updateMethodFields() {
      const averageMode = isAverageMethod();

      elements.slopeFields.classList.toggle(
        "hidden",
        averageMode
      );

      elements.averageMethodNotice.classList.toggle(
        "hidden",
        !averageMode
      );

      elements.pointWidthFields.classList.toggle(
        "hidden",
        !averageMode
      );

      if (averageMode && editingIndex === null) {
        fillInheritedWidths(false);
      }
    }

    function setBasicInputs() {
      const conditions = state.conditions;

      elements.calculationMethod.value =
        conditions.calc_method;

      elements.slopeTopWidth.value =
        conditions.slope_top_width_m ?? "";

      elements.frontSlope.value =
        conditions.front_slope_n ?? "";

      elements.rearSlope.value =
        conditions.rear_slope_n ?? "";

      updateMethodFields();
    }

    function syncConditions() {
      state.conditions.calc_method =
        elements.calculationMethod.value;

      state.conditions.slope_top_width_m =
        numberOrNull(elements.slopeTopWidth.value);

      state.conditions.front_slope_n =
        numberOrNull(elements.frontSlope.value);

      state.conditions.rear_slope_n =
        numberOrNull(elements.rearSlope.value);

      updateMethodFields();
      saveState();
      renderOutputs();
    }

    function validateBasicConditions(conditions) {
      if (conditions.calc_method === "上下幅平均") {
        return "";
      }

      if (
        conditions.slope_top_width_m === null ||
        conditions.slope_top_width_m <= 0
      ) {
        return "上幅を入力してください";
      }

      if (
        conditions.front_slope_n === null ||
        conditions.rear_slope_n === null
      ) {
        return "上幅と前後勾配を入力してください";
      }

      if (
        conditions.front_slope_n < 0 ||
        conditions.rear_slope_n < 0
      ) {
        return "勾配は0以上で入力してください";
      }

      return "";
    }

    function validatePoints(
      points,
      calculationMethod =
        state.conditions.calc_method
    ) {
      if (points.length < 2) {
        return "2測点以上入力してください";
      }

      for (
        let index = 0;
        index < points.length;
        index += 1
      ) {
        const point = points[index];

        if (
          point.section_length_m === null ||
          point.height_mm === null
        ) {
          return "区間長と高さを同じ測点に入力してください";
        }

        if (point.height_mm < 0) {
          return "高さは0以上で入力してください";
        }

        if (
          index === 0 &&
          point.section_length_m !== 0
        ) {
          return "1測点目の区間長は0にしてください";
        }

        if (
          index > 0 &&
          point.section_length_m <= 0
        ) {
          return "2測点目以降の区間長は0より大きくしてください";
        }

        if (calculationMethod === "上下幅平均") {
          if (
            point.point_top_width_m === null ||
            point.point_bottom_width_m === null
          ) {
            return "各測点の上幅と下幅を入力してください";
          }

          if (
            point.point_top_width_m <= 0 ||
            point.point_bottom_width_m <= 0
          ) {
            return "各測点の上幅と下幅は0より大きくしてください";
          }
        }
      }

      return "";
    }

    function calculate() {
      const conditions = state.conditions;

      const basicError =
        validateBasicConditions(conditions);

      const pointError =
        validatePoints(
          state.points,
          conditions.calc_method
        );

      const rows = [];
      let previousArea = null;
      let total = 0;

      state.points.forEach((point, index) => {
        const heightM =
          point.height_mm === null
            ? null
            : point.height_mm / 1000;

        let calculationWidth = null;
        let area = null;
        let section = index === 0 ? 0 : null;

        if (
          !basicError &&
          heightM !== null &&
          heightM >= 0
        ) {
          if (
            conditions.calc_method === "上下幅平均"
          ) {
            if (
              point.point_top_width_m !== null &&
              point.point_bottom_width_m !== null &&
              point.point_top_width_m > 0 &&
              point.point_bottom_width_m > 0
            ) {
              calculationWidth =
                (
                  point.point_top_width_m +
                  point.point_bottom_width_m
                ) / 2;

              area = calculationWidth * heightM;
            }
          } else {
            calculationWidth =
              conditions.slope_top_width_m +
              (
                conditions.front_slope_n +
                conditions.rear_slope_n
              ) *
              heightM;

            area =
              (
                (
                  conditions.slope_top_width_m +
                  calculationWidth
                ) / 2
              ) *
              heightM;
          }
        }

        if (
          index > 0 &&
          previousArea !== null &&
          area !== null &&
          point.section_length_m !== null &&
          point.section_length_m > 0
        ) {
          section =
            (
              (previousArea + area) / 2
            ) *
            point.section_length_m;

          total += section;
        }

        rows.push({
          point_no: index + 1,
          section_length_m:
            point.section_length_m,
          height_mm:
            point.height_mm,
          point_top_width_m:
            point.point_top_width_m,
          point_bottom_width_m:
            point.point_bottom_width_m,
          calc_width_m:
            calculationWidth,
          area_m2:
            area,
          section_m3:
            section
        });

        previousArea = area;
      });

      return {
        rows,
        total,
        error: basicError || pointError
      };
    }

    function renderResult(calculation) {
      const basicError =
        validateBasicConditions(state.conditions);

      elements.totalValue.textContent =
        basicError
          ? "－"
          : fixed(calculation.total, 3);

      if (calculation.error) {
        elements.resultStatus.textContent =
          calculation.error;

        elements.resultStatus.className =
          "result-status warning";
      } else {
        elements.resultStatus.textContent =
          "計算完了";

        elements.resultStatus.className =
          "result-status ok";
      }
    }

    function renderPoints(calculation) {
      const averageMode = isAverageMethod();

      elements.pointCount.textContent =
        `${state.points.length}測点`;

      if (state.points.length === 0) {
        elements.pointList.innerHTML = `
          <div class="empty">
            測点がありません。<br>
            1測点目は区間長「0」で追加してください。
          </div>
        `;

        return;
      }

      elements.pointList.innerHTML =
        calculation.rows
          .map(row => {
            const widthDetails = averageMode
              ? `
                <div class="point-value">
                  <small>上幅</small>
                  <strong>
                    ${fixed(row.point_top_width_m, 3)} m
                  </strong>
                </div>

                <div class="point-value">
                  <small>下幅</small>
                  <strong>
                    ${fixed(row.point_bottom_width_m, 3)} m
                  </strong>
                </div>
              `
              : "";

            return `
              <article class="point-card">
                <div class="point-head">
                  <div class="point-number">
                    測点 No.${row.point_no}
                  </div>

                  <div>
                    区間 ${
                      row.point_no === 1
                        ? "－"
                        : fixed(row.section_m3, 3) +
                          " m³"
                    }
                  </div>
                </div>

                <div class="point-data">
                  <div class="point-value">
                    <small>区間長</small>
                    <strong>
                      ${fixed(row.section_length_m, 3)} m
                    </strong>
                  </div>

                  <div class="point-value">
                    <small>高さ</small>
                    <strong>
                      ${fixed(row.height_mm, 0)} mm
                    </strong>
                  </div>

                  ${widthDetails}

                  <div class="point-value">
                    <small>計算幅</small>
                    <strong>
                      ${fixed(row.calc_width_m, 3)} m
                    </strong>
                  </div>

                  <div class="point-value">
                    <small>断面積</small>
                    <strong>
                      ${fixed(row.area_m2, 3)} m²
                    </strong>
                  </div>
                </div>

                <div class="point-actions">
                  <button
                    class="small-button edit-button"
                    type="button"
                    data-action="edit"
                    data-index="${row.point_no - 1}"
                  >
                    修正
                  </button>

                  <button
                    class="small-button delete-button"
                    type="button"
                    data-action="delete"
                    data-index="${row.point_no - 1}"
                  >
                    削除
                  </button>
                </div>
              </article>
            `;
          })
          .join("");
    }

    function renderOutputs() {
      const calculation = calculate();

      renderResult(calculation);
      renderPoints(calculation);
    }

    function resetPointForm() {
      editingIndex = null;

      elements.sectionLength.value =
        state.points.length === 0 ? "0" : "";

      elements.heightMm.value = "";

      const lastPoint = getLastPoint();

      if (lastPoint) {
        elements.pointTopWidth.value =
          lastPoint.point_top_width_m ?? "";

        elements.pointBottomWidth.value =
          lastPoint.point_bottom_width_m ?? "";
      } else {
        elements.pointTopWidth.value = "";
        elements.pointBottomWidth.value = "";
      }

      elements.pointError.textContent = "";

      elements.pointSubmitButton.textContent =
        "測点を追加";

      elements.cancelEditButton.classList.add(
        "hidden"
      );

      updateMethodFields();
    }

    function validatePointInput(
      sectionLength,
      heightMm,
      pointTopWidth,
      pointBottomWidth
    ) {
      const pointIndex =
        editingIndex === null
          ? state.points.length
          : editingIndex;

      if (
        sectionLength === null ||
        heightMm === null
      ) {
        return "区間長と高さを入力してください";
      }

      if (heightMm < 0) {
        return "高さは0以上で入力してください";
      }

      if (
        pointIndex === 0 &&
        sectionLength !== 0
      ) {
        return "1測点目の区間長は0にしてください";
      }

      if (
        pointIndex > 0 &&
        sectionLength <= 0
      ) {
        return "2測点目以降の区間長は0より大きくしてください";
      }

      if (isAverageMethod()) {
        if (
          pointTopWidth === null ||
          pointBottomWidth === null
        ) {
          return "上幅と下幅を入力してください";
        }

        if (
          pointTopWidth <= 0 ||
          pointBottomWidth <= 0
        ) {
          return "上幅と下幅は0より大きくしてください";
        }
      }

      return "";
    }

    function editPoint(index) {
      const point = state.points[index];

      if (!point) {
        return;
      }

      editingIndex = index;

      elements.sectionLength.value =
        point.section_length_m ?? "";

      elements.heightMm.value =
        point.height_mm ?? "";

      elements.pointTopWidth.value =
        point.point_top_width_m ?? "";

      elements.pointBottomWidth.value =
        point.point_bottom_width_m ?? "";

      elements.pointSubmitButton.textContent =
        "測点を更新";

      elements.cancelEditButton.classList.remove(
        "hidden"
      );

      elements.pointError.textContent = "";

      elements.sectionLength.focus();

      window.scrollTo({
        top:
          elements.pointForm
            .getBoundingClientRect()
            .top +
          window.scrollY -
          100,
        behavior: "smooth"
      });
    }

    function deletePoint(index) {
      if (!state.points[index]) {
        return;
      }

      if (
        !confirm(
          `測点 No.${index + 1}を削除しますか？`
        )
      ) {
        return;
      }

      state.points.splice(index, 1);

      if (state.points.length > 0) {
        state.points[0].section_length_m = 0;
      }

      saveState();
      resetPointForm();
      renderOutputs();
      showToast("測点を削除しました");
    }

    elements.pointForm.addEventListener(
      "submit",
      event => {
        event.preventDefault();

        const sectionLength =
          numberOrNull(
            elements.sectionLength.value
          );

        const heightMm =
          numberOrNull(
            elements.heightMm.value
          );

        const pointTopWidth =
          numberOrNull(
            elements.pointTopWidth.value
          );

        const pointBottomWidth =
          numberOrNull(
            elements.pointBottomWidth.value
          );

        const error = validatePointInput(
          sectionLength,
          heightMm,
          pointTopWidth,
          pointBottomWidth
        );

        if (error) {
          elements.pointError.textContent = error;
          return;
        }

        const existingPoint =
          editingIndex === null
            ? null
            : state.points[editingIndex];

        const point = {
          section_length_m: sectionLength,
          height_mm: heightMm,

          point_top_width_m:
            isAverageMethod()
              ? pointTopWidth
              : (
                  pointTopWidth ??
                  existingPoint?.point_top_width_m ??
                  null
                ),

          point_bottom_width_m:
            isAverageMethod()
              ? pointBottomWidth
              : (
                  pointBottomWidth ??
                  existingPoint?.point_bottom_width_m ??
                  null
                )
        };

        if (editingIndex === null) {
          state.points.push(point);
          showToast("測点を追加しました");
        } else {
          state.points[editingIndex] = point;
          showToast("測点を更新しました");
        }

        saveState();
        resetPointForm();
        renderOutputs();
      }
    );

    elements.cancelEditButton.addEventListener(
      "click",
      () => {
        resetPointForm();
      }
    );

    elements.pointList.addEventListener(
      "click",
      event => {
        const button =
          event.target.closest("[data-action]");

        if (!button) {
          return;
        }

        const index =
          Number(button.dataset.index);

        if (button.dataset.action === "edit") {
          editPoint(index);
        }

        if (button.dataset.action === "delete") {
          deletePoint(index);
        }
      }
    );

    [
      elements.slopeTopWidth,
      elements.frontSlope,
      elements.rearSlope
    ].forEach(input => {
      input.addEventListener(
        "input",
        syncConditions
      );
    });

    elements.calculationMethod.addEventListener(
      "change",
      syncConditions
    );

    function csvEscape(value) {
      const text =
        value === null ||
        value === undefined
          ? ""
          : String(value);

      return `"${text.replace(/"/g, '""')}"`;
    }

    function createCsv() {
      const calculation = calculate();

      if (calculation.error) {
        throw new Error(calculation.error);
      }

      const headers = [
        "app_version",
        "calc_method",
        "slope_top_width_m",
        "front_slope_n",
        "rear_slope_n",
        "point_no",
        "section_length_m",
        "height_mm",
        "point_top_width_m",
        "point_bottom_width_m",
        "calc_width_m",
        "area_m2",
        "section_m3",
        "total_m3",
        "updated_at"
      ];

      const rows = calculation.rows.map(row => [
        APP_VERSION,
        state.conditions.calc_method,
        state.conditions.slope_top_width_m,
        state.conditions.front_slope_n,
        state.conditions.rear_slope_n,
        row.point_no,
        row.section_length_m,
        row.height_mm,
        row.point_top_width_m,
        row.point_bottom_width_m,
        row.calc_width_m,
        row.area_m2,
        row.section_m3,
        calculation.total,
        state.updated_at
      ]);

      return [
        headers.map(csvEscape).join(","),
        ...rows.map(row =>
          row.map(csvEscape).join(",")
        )
      ].join("\r\n");
    }

    async function exportCsv() {
      try {
        const csv = createCsv();
        const date = new Date();

        const dateText =
          `${date.getFullYear()}` +
          `${String(
            date.getMonth() + 1
          ).padStart(2, "0")}` +
          `${String(
            date.getDate()
          ).padStart(2, "0")}`;

        const fileName =
          `VolumeCo_${dateText}.csv`;

        const blob = new Blob(
          ["\uFEFF" + csv],
          {
            type: "text/csv;charset=utf-8"
          }
        );

        const file = new File(
          [blob],
          fileName,
          {
            type: "text/csv;charset=utf-8"
          }
        );

        if (
          navigator.share &&
          navigator.canShare &&
          navigator.canShare({
            files: [file]
          })
        ) {
          await navigator.share({
            files: [file],
            title: "VolumeCo計算結果"
          });

          showToast("CSVを共有しました");
          return;
        }

        const url =
          URL.createObjectURL(blob);

        const link =
          document.createElement("a");

        link.href = url;
        link.download = fileName;

        document.body.appendChild(link);
        link.click();
        link.remove();

        setTimeout(
          () => URL.revokeObjectURL(url),
          1000
        );

        showToast("CSVを出力しました");
      } catch (error) {
        if (error.name !== "AbortError") {
          alert(
            error.message ||
            "CSVを出力できませんでした"
          );
        }
      }
    }

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let field = "";
      let inQuotes = false;

      const source =
        text.replace(/^\uFEFF/, "");

      for (
        let index = 0;
        index < source.length;
        index += 1
      ) {
        const character = source[index];

        if (inQuotes) {
          if (character === '"') {
            if (source[index + 1] === '"') {
              field += '"';
              index += 1;
            } else {
              inQuotes = false;
            }
          } else {
            field += character;
          }
        } else if (character === '"') {
          inQuotes = true;
        } else if (character === ",") {
          row.push(field);
          field = "";
        } else if (character === "\n") {
          row.push(field);
          rows.push(row);
          row = [];
          field = "";
        } else if (character !== "\r") {
          field += character;
        }
      }

      row.push(field);

      if (
        row.some(value => value !== "")
      ) {
        rows.push(row);
      }

      return rows.filter(csvRow =>
        csvRow.some(
          value => value.trim() !== ""
        )
      );
    }

    async function importCsv(file) {
      const text = await file.text();
      const csvRows = parseCsv(text);

      if (csvRows.length < 2) {
        throw new Error(
          "CSVにデータがありません"
        );
      }

      const headers =
        csvRows[0].map(
          header => header.trim()
        );

      const requiredHeaders = [
        "calc_method",
        "slope_top_width_m",
        "front_slope_n",
        "rear_slope_n",
        "point_no",
        "section_length_m",
        "height_mm",
        "point_top_width_m",
        "point_bottom_width_m"
      ];

      for (
        const header of requiredHeaders
      ) {
        if (!headers.includes(header)) {
          throw new Error(
            `CSV項目「${header}」がありません`
          );
        }
      }

      const records =
        csvRows.slice(1).map(csvRow => {
          const record = {};

          headers.forEach(
            (header, index) => {
              record[header] =
                csvRow[index] ?? "";
            }
          );

          return record;
        });

      const first = records[0];

      const importedState = {
        version: APP_VERSION,

        conditions: {
          calc_method:
            first.calc_method === "上下幅平均"
              ? "上下幅平均"
              : "勾配で計算",

          slope_top_width_m:
            numberOrNull(
              first.slope_top_width_m
            ),

          front_slope_n:
            numberOrNull(
              first.front_slope_n
            ),

          rear_slope_n:
            numberOrNull(
              first.rear_slope_n
            )
        },

        points: records
          .map(record => ({
            point_no:
              Number(record.point_no),

            section_length_m:
              numberOrNull(
                record.section_length_m
              ),

            height_mm:
              numberOrNull(
                record.height_mm
              ),

            point_top_width_m:
              numberOrNull(
                record.point_top_width_m
              ),

            point_bottom_width_m:
              numberOrNull(
                record.point_bottom_width_m
              )
          }))
          .sort(
            (firstPoint, secondPoint) =>
              firstPoint.point_no -
              secondPoint.point_no
          )
          .map(record => ({
            section_length_m:
              record.section_length_m,

            height_mm:
              record.height_mm,

            point_top_width_m:
              record.point_top_width_m,

            point_bottom_width_m:
              record.point_bottom_width_m
          })),

        updated_at:
          new Date().toISOString()
      };

      const basicError =
        validateBasicConditions(
          importedState.conditions
        );

      if (basicError) {
        throw new Error(basicError);
      }

      const pointError =
        validatePoints(
          importedState.points,
          importedState.conditions.calc_method
        );

      if (pointError) {
        throw new Error(pointError);
      }

      state = importedState;

      saveState();
      setBasicInputs();
      resetPointForm();
      renderOutputs();
      showToast("CSVを読み込みました");
    }

    elements.csvExportButton.addEventListener(
      "click",
      exportCsv
    );

    elements.csvImportButton.addEventListener(
      "click",
      () => {
        elements.csvFileInput.click();
      }
    );

    elements.csvFileInput.addEventListener(
      "change",
      async event => {
        const file =
          event.target.files[0];

        if (!file) {
          return;
        }

        try {
          await importCsv(file);
        } catch (error) {
          alert(
            error.message ||
            "CSVを読み込めませんでした"
          );
        } finally {
          elements.csvFileInput.value = "";
        }
      }
    );

    elements.newCalculationButton.addEventListener(
      "click",
      () => {
        if (
          !confirm(
            "入力中の内容を消去して新しい計算を始めますか？"
          )
        ) {
          return;
        }

        state = createInitialState(false);

        saveState();
        setBasicInputs();
        resetPointForm();
        renderOutputs();
        showToast(
          "新しい計算を開始しました"
        );
      }
    );

    setBasicInputs();
    resetPointForm();
    renderOutputs();
    saveState();

    if ("serviceWorker" in navigator) {
      window.addEventListener(
        "load",
        () => {
          navigator.serviceWorker
            .register(
              "./sw.js",
              { scope: "./" }
            )
            .then(
              registration =>
                registration.update()
            )
            .catch(
              error =>
                console.error(error)
            );
        }
      );
    }
  </script>
</body>
</html>
