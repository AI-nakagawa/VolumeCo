<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f4e78">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="残量計算">

  <title>コンクリート残量計算</title>
  <link rel="manifest" href="./manifest.webmanifest">

  <style>
    :root {
      --navy: #1f4e78;
      --blue: #2f75b5;
      --light-blue: #d9eaf7;
      --green: #2e7d32;
      --light-green: #e8f5e9;
      --yellow: #fff4c4;
      --red: #c62828;
      --gray: #64748b;
      --light-gray: #f1f5f9;
      --border: #cbd5e1;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      background: #eef3f7;
      color: #1e293b;
      font-family:
        -apple-system, BlinkMacSystemFont, "Yu Gothic", "Hiragino Kaku Gothic ProN",
        "Segoe UI", sans-serif;
      font-size: 16px;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      min-height: 48px;
      border: 0;
      border-radius: 10px;
      padding: 10px 16px;
      font-weight: 700;
      cursor: pointer;
    }

    input,
    select,
    textarea {
      width: 100%;
      min-height: 50px;
      border: 2px solid var(--border);
      border-radius: 10px;
      background: var(--white);
      padding: 10px 12px;
      font-size: 18px;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--blue);
      outline: 3px solid rgba(47, 117, 181, 0.16);
    }

    input[type="number"] {
      text-align: right;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 20;
      padding:
        max(10px, env(safe-area-inset-top))
        14px 10px;
      color: var(--white);
      background: var(--navy);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
    }

    .header-row {
      max-width: 760px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .app-title {
      margin: 0;
      font-size: 19px;
    }

    .connection {
  　　display: none;
      flex-shrink: 0;
      border-radius: 999px;
      padding: 5px 9px;
      background: rgba(255, 255, 255, 0.18);
      font-size: 12px;
      font-weight: 700;
    }

    .total-bar {
      max-width: 760px;
      margin: 10px auto 0;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 10px 14px;
      color: #16324f;
      background: var(--light-green);
      border-radius: 12px;
    }

    .total-label {
      font-weight: 700;
    }

    .total-value {
      font-size: 26px;
      font-weight: 800;
      color: var(--green);
    }

    .tabs {
      position: sticky;
      top: 120px;
      z-index: 15;
      max-width: 760px;
      margin: 0 auto;
      padding: 8px 10px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      background: #eef3f7;
    }

    .tab-button {
      min-height: 44px;
      padding: 7px 5px;
      color: var(--navy);
      background: var(--white);
      border: 1px solid var(--border);
      font-size: 14px;
    }

    .tab-button.active {
      color: var(--white);
      background: var(--blue);
      border-color: var(--blue);
    }

    main {
      max-width: 760px;
      margin: auto;
      padding: 6px 10px 100px;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    .card {
      margin-bottom: 12px;
      padding: 16px;
      background: var(--white);
      border-radius: 14px;
      box-shadow: 0 2px 7px rgba(15, 23, 42, 0.08);
    }

    .card h2 {
      margin: 0 0 14px;
      padding-bottom: 8px;
      color: var(--navy);
      border-bottom: 2px solid var(--light-blue);
      font-size: 18px;
    }

    .field {
      margin-bottom: 15px;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 700;
    }

    .required::after {
      content: " 必須";
      color: var(--red);
      font-size: 11px;
    }

    .unit-field {
      display: grid;
      grid-template-columns: 1fr 58px;
      gap: 7px;
      align-items: center;
    }

    .unit {
      color: var(--gray);
      text-align: center;
      font-weight: 700;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .notice {
      margin-bottom: 12px;
      padding: 11px 12px;
      border-radius: 10px;
      background: var(--light-blue);
      line-height: 1.6;
      font-size: 14px;
    }

    .status-message {
      display: none;
      margin-bottom: 12px;
      padding: 12px;
      border-radius: 10px;
      font-weight: 700;
    }

    .status-message.show {
      display: block;
    }

    .status-message.info {
      color: #1e4f7a;
      background: var(--light-blue);
    }

    .status-message.success {
      color: #1b5e20;
      background: var(--light-green);
    }

    .status-message.error {
      color: #8b1a1a;
      background: #ffebee;
    }

    .button-primary {
      color: var(--white);
      background: var(--blue);
    }

    .button-success {
      color: var(--white);
      background: var(--green);
    }

    .button-secondary {
      color: var(--navy);
      background: var(--light-blue);
    }

    .button-danger {
      color: var(--white);
      background: var(--red);
    }

    .button-neutral {
      color: #334155;
      background: var(--light-gray);
      border: 1px solid var(--border);
    }

    .button-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }

    .button-full {
      width: 100%;
    }

    .point-entry {
      padding: 14px;
      background: var(--yellow);
      border: 2px solid #edd269;
      border-radius: 12px;
    }

    .point-list {
      display: grid;
      gap: 10px;
    }

    .point-card {
      padding: 12px;
      background: var(--white);
      border: 1px solid var(--border);
      border-left: 5px solid var(--blue);
      border-radius: 10px;
    }

    .point-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .point-number {
      color: var(--navy);
      font-size: 18px;
      font-weight: 800;
    }

    .point-values {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
      margin-bottom: 8px;
    }

    .point-value {
      padding: 8px;
      background: var(--light-gray);
      border-radius: 8px;
      text-align: center;
    }

    .point-value small {
      display: block;
      margin-bottom: 2px;
      color: var(--gray);
    }

    .calculated-values {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      margin-bottom: 8px;
      font-size: 12px;
    }

    .calculated-values div {
      padding: 7px 3px;
      background: var(--light-blue);
      border-radius: 7px;
      text-align: center;
    }

    .point-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }

    .point-actions button {
      min-height: 42px;
      padding: 6px;
      font-size: 14px;
    }

    .result-total {
      padding: 20px 10px;
      color: var(--green);
      background: var(--light-green);
      border-radius: 12px;
      text-align: center;
    }

    .result-total small {
      display: block;
      color: #355c38;
      font-weight: 700;
    }

    .result-total strong {
      display: block;
      margin-top: 4px;
      font-size: 38px;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    .summary-box {
      padding: 12px 6px;
      background: var(--light-gray);
      border-radius: 9px;
      text-align: center;
    }

    .summary-box small {
      display: block;
      color: var(--gray);
    }

    .summary-box strong {
      display: block;
      margin-top: 4px;
      font-size: 18px;
    }

    .saved-list {
      display: grid;
      gap: 9px;
    }

    .saved-card {
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .saved-card-title {
      margin-bottom: 4px;
      font-weight: 800;
    }

    .saved-card-detail {
      margin-bottom: 8px;
      color: var(--gray);
      font-size: 13px;
    }

    .empty {
      padding: 20px;
      color: var(--gray);
      text-align: center;
    }

    .footer-actions {
      position: fixed;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 30;
      padding:
        9px 10px
        max(9px, env(safe-area-inset-bottom));
      background: rgba(255, 255, 255, 0.96);
      border-top: 1px solid var(--border);
      backdrop-filter: blur(8px);
    }

    .footer-actions-inner {
      max-width: 760px;
      margin: auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .hidden {
      display: none !important;
    }

    .version {
      margin-top: 16px;
      color: var(--gray);
      text-align: center;
      font-size: 12px;
    }

    @media (max-width: 420px) {
      .grid-2 {
        grid-template-columns: 1fr;
        gap: 0;
      }

      .total-value {
        font-size: 23px;
      }

      .calculated-values {
        font-size: 11px;
      }
    }
  </style>
</head>

<body>
  <header class="app-header">
    <div class="header-row">
      <h1 class="app-title">コンクリート残量計算</h1>
      <span id="connectionStatus" class="connection">確認中</span>
    </div>

    <div class="total-bar">
      <span class="total-label">合計数量</span>
      <span id="headerTotal" class="total-value">0.000 m³</span>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab-button active" data-tab="conditions">1. 基本条件</button>
    <button class="tab-button" data-tab="points">2. 測点入力</button>
    <button class="tab-button" data-tab="results">3. 結果・保存</button>
  </nav>

  <main>
    <div id="message" class="status-message"></div>

    <section id="conditions" class="screen active">
      <div class="card">
        <h2>現場情報</h2>

        <div class="field">
          <label for="siteName" class="required">現場名</label>
          <input id="siteName" type="text" autocomplete="off" placeholder="例：A工区">
        </div>

        <div class="grid-2">
          <div class="field">
            <label for="operator" class="required">担当者</label>
            <input id="operator" type="text" autocomplete="name" placeholder="担当者名">
          </div>

          <div class="field">
            <label for="recordDate" class="required">記録日</label>
            <input id="recordDate" type="date">
          </div>
        </div>
      </div>

      <div class="card">
        <h2>計算条件</h2>

        <div class="field">
          <label for="method" class="required">計算方式</label>
          <select id="method">
            <option value="勾配で計算">勾配で計算</option>
            <option value="上下幅平均">上下幅平均</option>
          </select>
        </div>

        <div class="field">
          <label for="topWidth" class="required">上幅</label>
          <div class="unit-field">
            <input id="topWidth" type="number" inputmode="decimal" step="0.001">
            <span class="unit">m</span>
          </div>
        </div>

        <div id="averageFields" class="hidden">
          <div class="field">
            <label for="bottomWidth" class="required">下幅</label>
            <div class="unit-field">
              <input id="bottomWidth" type="number" inputmode="decimal" step="0.001">
              <span class="unit">m</span>
            </div>
          </div>
        </div>

        <div id="slopeFields">
          <div class="grid-2">
            <div class="field">
              <label for="frontSlope" class="required">前勾配</label>
              <input id="frontSlope" type="number" inputmode="decimal" step="0.001">
            </div>

            <div class="field">
              <label for="rearSlope" class="required">後勾配</label>
              <input id="rearSlope" type="number" inputmode="decimal" step="0.001">
            </div>
          </div>
        </div>

        <div class="field">
          <label for="notes">備考</label>
          <textarea id="notes" placeholder="段差、開口、埋設物など"></textarea>
        </div>

        <button id="toPointsButton" class="button-primary button-full">
          次へ：測点入力
        </button>
      </div>
    </section>

    <section id="points" class="screen">
      <div class="notice">
        距離は始点からの累積値を入力してください。距離と高さは同じ測点に入力します。
      </div>

      <div class="card">
        <h2 id="pointEntryTitle">測点を追加</h2>

        <div class="point-entry">
          <div class="grid-2">
            <div class="field">
              <label for="pointDistance" class="required">距離</label>
              <div class="unit-field">
                <input
                  id="pointDistance"
                  type="number"
                  inputmode="decimal"
                  step="0.001"
                  placeholder="0.000"
                >
                <span class="unit">m</span>
              </div>
            </div>

            <div class="field">
              <label for="pointHeight" class="required">高さ</label>
              <div class="unit-field">
                <input
                  id="pointHeight"
                  type="number"
                  inputmode="decimal"
                  step="1"
                  placeholder="1000"
                >
                <span class="unit">mm</span>
              </div>
            </div>
          </div>

          <div class="button-row">
            <button id="addPointButton" class="button-success">測点を追加</button>
            <button id="cancelEditButton" class="button-neutral hidden">修正を中止</button>
          </div>
        </div>
      </div>

      <div class="card">
        <h2>入力済み測点</h2>
        <div id="pointList" class="point-list"></div>
      </div>

      <div class="button-row">
        <button id="sampleButton" class="button-secondary">サンプル読込</button>
        <button id="toResultsButton" class="button-primary">計算結果を確認</button>
      </div>
    </section>

    <section id="results" class="screen">
      <div class="card">
        <h2>計算結果</h2>

        <div class="result-total">
          <small>合計数量</small>
          <strong id="resultTotal">0.000 m³</strong>
        </div>

        <div class="summary-grid">
          <div class="summary-box">
            <small>測点数</small>
            <strong id="pointCount">0</strong>
          </div>

          <div class="summary-box">
            <small>計算状態</small>
            <strong id="calculationStatus">未入力</strong>
          </div>
        </div>
      </div>

      <div class="card">
        <h2>保存・バックアップ</h2>

        <button id="saveProjectButton" class="button-success button-full">
          この案件を端末に保存
        </button>

        <div class="button-row">
          <button id="exportCsvButton" class="button-primary">CSV出力</button>
          <button id="importCsvButton" class="button-secondary">CSV読込</button>
        </div>

        <input
          id="csvFileInput"
          class="hidden"
          type="file"
          accept=".csv,text/csv"
        >

        <div class="button-row">
          <button id="installGuideButton" class="button-neutral">ホーム画面追加</button>
          <button id="newProjectButton" class="button-danger">新規計算</button>
        </div>
      </div>

      <div class="card">
        <h2>端末に保存した案件</h2>
        <div id="savedProjectList" class="saved-list"></div>
      </div>

      <div class="version">VolumeCo Version 0.1</div>
    </section>
  </main>

  <footer class="footer-actions">
    <div class="footer-actions-inner">
      <button id="footerSaveButton" class="button-success">自動保存済み</button>
      <button id="footerResultButton" class="button-primary">結果を見る</button>
    </div>
  </footer>

  <script>
    "use strict";

    const APP_VERSION = "0.1";
    const CURRENT_KEY = "volumeco_current";
    const RECORDS_KEY = "volumeco_records";
    const OPERATOR_KEY = "volumeco_operator";

    let editingPointIndex = null;
    let state = loadCurrentState();

    function todayString() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const day = String(now.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function createRecordId() {
      const now = new Date();
      const date =
        now.getFullYear() +
        String(now.getMonth() + 1).padStart(2, "0") +
        String(now.getDate()).padStart(2, "0");

      const time =
        String(now.getHours()).padStart(2, "0") +
        String(now.getMinutes()).padStart(2, "0") +
        String(now.getSeconds()).padStart(2, "0");

      return `${date}-${time}`;
    }

    function blankState() {
      return {
        schema_version: "1.0",
        app_version: APP_VERSION,
        record_id: createRecordId(),
        site_name: "",
        operator: localStorage.getItem(OPERATOR_KEY) || "",
        record_date: todayString(),
        method: "勾配で計算",
        top_width_m: 2,
        bottom_width_m: 2,
        front_slope: 0.5,
        rear_slope: 0,
        notes: "",
        points: [],
        updated_at: new Date().toISOString()
      };
    }

    function loadCurrentState() {
      try {
        const saved = localStorage.getItem(CURRENT_KEY);
        if (!saved) return blankState();

        const parsed = JSON.parse(saved);
        return {
          ...blankState(),
          ...parsed,
          points: Array.isArray(parsed.points) ? parsed.points : []
        };
      } catch (error) {
        return blankState();
      }
    }

    function getRecords() {
      try {
        return JSON.parse(localStorage.getItem(RECORDS_KEY) || "[]");
      } catch (error) {
        return [];
      }
    }

    function setRecords(records) {
      localStorage.setItem(RECORDS_KEY, JSON.stringify(records));
    }

    function numberOrNull(value) {
      if (value === "" || value === null || value === undefined) return null;

      const number = Number(value);
      return Number.isFinite(number) ? number : null;
    }

    function formatNumber(value, decimals = 3) {
      if (!Number.isFinite(value)) return "-";
      return value.toFixed(decimals);
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function showMessage(text, type = "info") {
      const message = document.getElementById("message");
      message.textContent = text;
      message.className = `status-message show ${type}`;

      window.clearTimeout(showMessage.timer);
      showMessage.timer = window.setTimeout(() => {
        message.className = "status-message";
      }, 4500);
    }

    function showTab(tabId) {
      document.querySelectorAll(".screen").forEach((screen) => {
        screen.classList.toggle("active", screen.id === tabId);
      });

      document.querySelectorAll(".tab-button").forEach((button) => {
        button.classList.toggle("active", button.dataset.tab === tabId);
      });

      window.scrollTo({ top: 0, behavior: "smooth" });

      if (tabId === "points") {
        window.setTimeout(() => {
          document.getElementById("pointDistance").focus();
        }, 250);
      }
    }

    function fillFormFromState() {
      document.getElementById("siteName").value = state.site_name || "";
      document.getElementById("operator").value = state.operator || "";
      document.getElementById("recordDate").value =
        state.record_date || todayString();
      document.getElementById("method").value =
        state.method || "勾配で計算";

      document.getElementById("topWidth").value =
        state.top_width_m ?? "";
      document.getElementById("bottomWidth").value =
        state.bottom_width_m ?? "";
      document.getElementById("frontSlope").value =
        state.front_slope ?? "";
      document.getElementById("rearSlope").value =
        state.rear_slope ?? "";
      document.getElementById("notes").value = state.notes || "";

      updateMethodFields();
    }

    function updateStateFromForm() {
      state.site_name = document.getElementById("siteName").value.trim();
      state.operator = document.getElementById("operator").value.trim();
      state.record_date =
        document.getElementById("recordDate").value || todayString();
      state.method = document.getElementById("method").value;

      state.top_width_m = numberOrNull(
        document.getElementById("topWidth").value
      );
      state.bottom_width_m = numberOrNull(
        document.getElementById("bottomWidth").value
      );
      state.front_slope = numberOrNull(
        document.getElementById("frontSlope").value
      );
      state.rear_slope = numberOrNull(
        document.getElementById("rearSlope").value
      );

      state.notes = document.getElementById("notes").value.trim();
      state.updated_at = new Date().toISOString();

      if (state.operator) {
        localStorage.setItem(OPERATOR_KEY, state.operator);
      }

      autoSave();
    }

    function autoSave() {
      localStorage.setItem(CURRENT_KEY, JSON.stringify(state));

      const saveButton = document.getElementById("footerSaveButton");
      saveButton.textContent = "自動保存済み";

      window.clearTimeout(autoSave.timer);
      autoSave.timer = window.setTimeout(() => {
        saveButton.textContent = "端末内に保存";
      }, 1200);
    }

    function updateMethodFields() {
      const method = document.getElementById("method").value;

      document
        .getElementById("averageFields")
        .classList.toggle("hidden", method !== "上下幅平均");

      document
        .getElementById("slopeFields")
        .classList.toggle("hidden", method === "上下幅平均");
    }

    function validateBasicConditions() {
      if (state.top_width_m === null) {
        return "上幅を入力してください";
      }

      if (state.method === "上下幅平均") {
        if (state.bottom_width_m === null) {
          return "上幅と下幅を入力してください";
        }
      } else {
        if (
          state.front_slope === null ||
          state.rear_slope === null
        ) {
          return "上幅と前後勾配を入力してください";
        }
      }

      return "";
    }

    function calculate() {
      const basicError = validateBasicConditions();

      if (basicError) {
        return {
          error: basicError,
          total: 0,
          rows: []
        };
      }

      const rows = [];
      let total = 0;

      for (let index = 0; index < state.points.length; index++) {
        const point = state.points[index];
        const heightM = point.height_mm / 1000;

        let calculatedWidth;

        if (state.method === "上下幅平均") {
          calculatedWidth =
            (state.top_width_m + state.bottom_width_m) / 2;
        } else {
          calculatedWidth =
            state.top_width_m +
            (state.front_slope + state.rear_slope) * heightM;
        }

        let area;

        if (state.method === "上下幅平均") {
          area = calculatedWidth * heightM;
        } else {
          area =
            ((state.top_width_m + calculatedWidth) / 2) *
            heightM;
        }

        let section = 0;

        if (index > 0) {
          const previousRow = rows[index - 1];
          const distanceDifference =
            point.distance_m - state.points[index - 1].distance_m;

          section =
            ((previousRow.area_m2 + area) / 2) *
            distanceDifference;
        }

        total += section;

        rows.push({
          ...point,
          calc_width_m: calculatedWidth,
          area_m2: area,
          section_m3: section
        });
      }

      let error = "";

      if (state.points.length < 2) {
        error = state.points.length === 0
          ? "測点を追加してください"
          : "2測点以上入力してください";
      }

      return {
        error,
        total,
        rows
      };
    }

    function renderCalculation() {
      const calculation = calculate();
      const totalText = `${formatNumber(calculation.total)} m³`;

      document.getElementById("headerTotal").textContent = totalText;
      document.getElementById("resultTotal").textContent = totalText;
      document.getElementById("pointCount").textContent =
        state.points.length;

      const status = document.getElementById("calculationStatus");

      if (calculation.error) {
        status.textContent = "入力確認";
        status.style.color = "#c62828";
      } else {
        status.textContent = "計算完了";
        status.style.color = "#2e7d32";
      }

      return calculation;
    }

    function renderPoints() {
      const calculation = renderCalculation();
      const list = document.getElementById("pointList");

      if (state.points.length === 0) {
        list.innerHTML =

      list.innerHTML = calculation.rows.map((row, index) => `

              <strong>${formatNumber(row.distance_m)} m</strong>
            </div>

            <div class="point-value">
              <small>高さ</small>
              <strong>${formatNumber(row.height_mm, 0)} mm</strong>
            </div>
          </div>

          <div class="calculated-values">
            <div>

              <strong>${formatNumber(row.calc_width_m)}</strong>
            </div>

      `).join("");

      list.querySelectorAll("[data-edit-point]").forEach((button) => {

      });

    function validatePoint(distance, height, indexToReplace = null) {
      if (distance === null || height === null) {
        return "距離と高さを同じ測点に入力してください";
      }

      if (distance < 0) {
        return "距離は0以上で入力してください";
      }

      if (height < 0) {
        return "高さは0以上で入力してください";
      }

      const testPoints = state.points.map((point) => ({ ...point }));
      const newPoint = {
        distance_m: distance,
        height_mm: height
      };

      if (indexToReplace === null) {
        testPoints.push(newPoint);
      } else {
        testPoints[indexToReplace] = newPoint;
      }

      for (let index = 1; index < testPoints.length; index++) {
        if (
          testPoints[index].distance_m <=
          testPoints[index - 1].distance_m
        ) {
          return "距離は前の測点より大きくしてください";
        }
      }

      return "";
    }

    function addOrUpdatePoint() {
      updateStateFromForm();

      const distanceInput = document.getElementById("pointDistance");
      const heightInput = document.getElementById("pointHeight");

      const distance = numberOrNull(distanceInput.value);
      const height = numberOrNull(heightInput.value);

      const error = validatePoint(distance, height, editingPointIndex);

      if (error) {
        showMessage(error, "error");
        return;
      }

      const point = {
        distance_m: distance,
        height_mm: height
      };

      if (editingPointIndex === null) {
        state.points.push(point);
        showMessage("測点を追加しました", "success");
      } else {
        state.points[editingPointIndex] = point;
        showMessage("測点を修正しました", "success");
      }

      const previousHeight = heightInput.value;

      cancelPointEdit();
      distanceInput.value = "";
      heightInput.value = previousHeight;
      distanceInput.focus();

      state.updated_at = new Date().toISOString();
      autoSave();
      renderPoints();
    }

    function startPointEdit(index) {
      const point = state.points[index];

      editingPointIndex = index;

      document.getElementById("pointDistance").value =
        point.distance_m;
      document.getElementById("pointHeight").value =
        point.height_mm;

      document.getElementById("pointEntryTitle").textContent =
        `測点No.${index + 1}を修正`;

      document.getElementById("addPointButton").textContent =

    function cancelPointEdit() {

    function saveProject() {
      updateStateFromForm();

      if (!state.site_name) {

        showMessage("現場名を入力してください", "error");
        return;
      }

      if (!state.operator) {

        return;

      const calculation = calculate();

      if (calculation.error) {
        showMessage(calculation.error, "error");
        return;
      }

      const records = getRecords();
      const savedRecord = {
        ...state,
        saved_total_m3: calculation.total,
        updated_at: new Date().toISOString()
      };

      const existingIndex = records.findIndex(
        (record) => record.record_id === state.record_id
      );

      if (existingIndex >= 0) {
        records[existingIndex] = savedRecord;
      } else {
        records.unshift(savedRecord);
      }

      setRecords(records);
      state = savedRecord;
      autoSave();
      renderSavedProjects();
      showMessage("案件を端末に保存しました", "success");
    }

    function renderSavedProjects() {

    function openRecord(recordId) {
      const record = getRecords().find(

        return;

        ...blankState(),
        ...record,
        points: Array.isArray(record.points) ? record.points : []

      cancelPointEdit();
      fillFormFromState();
      autoSave();
      renderAll();
      showTab("results");
      showMessage("保存した案件を開きました", "success");
    }

    function deleteRecord(recordId) {
      if (!confirm("この保存案件を削除してよろしいですか？")) {
        return;
      }

      const records = getRecords().filter(
        (record) => record.record_id !== recordId
      );

      setRecords(records);
      renderSavedProjects();
      showMessage("保存案件を削除しました", "success");

    function newProject() {
      if (
        state.points.length > 0 &&
        !confirm("現在の入力内容を終了して、新規計算を始めますか？")
      ) {

      }

      state = blankState();

    function csvEscape(value) {
      const text = String(value ?? "");

      if (
        text.includes(",") ||
        text.includes('"') ||
        text.includes("\n")
      ) {
        return `"${text.replaceAll('"', '""')}"`;
      }

      return text;
    }

    function exportCsv() {
      updateStateFromForm();

      const calculation = calculate();

      if (calculation.error) {
        showMessage(calculation.error, "error");
        return;
      }

      const headers = [
        "schema_version",
        "record_id",
        "site_name",
        "operator",
        "record_date",
        "method",
        "top_width_m",
        "bottom_width_m",
        "front_slope",
        "rear_slope",
        "point_no",
        "distance_m",
        "height_mm",
        "calc_width_m",
        "area_m2",
        "section_m3",
        "total_m3",
        "notes",
        "updated_at"
      ];

      const rows = calculation.rows.map((row, index) => [
        state.schema_version,
        state.record_id,
        state.site_name,
        state.operator,
        state.record_date,
        state.method,
        state.top_width_m,
        state.bottom_width_m ?? "",
        state.front_slope ?? "",
        state.rear_slope ?? "",
        index + 1,
        row.distance_m,
        row.height_mm,
        row.calc_width_m,
        row.area_m2,
        row.section_m3,
        calculation.total,
        state.notes,
        new Date().toISOString()
      ]);

      const csv = [
        headers.map(csvEscape).join(","),
        ...rows.map((row) => row.map(csvEscape).join(","))
      ].join("\r\n");

      const blob = new Blob(
        ["\ufeff" + csv],
        { type: "text/csv;charset=utf-8" }
      );

      const safeSiteName =
        (state.site_name || "残量計算")
          .replace(/[\\/:*?"<>|]/g, "_");

      const fileName =
        `${safeSiteName}_${state.record_date}_${state.record_id}.csv`;

      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");

      link.href = url;
      link.download = fileName;
      document.body.appendChild(link);
      link.click();
      link.remove();

      URL.revokeObjectURL(url);
      showMessage("CSVを出力しました", "success");
    }

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let field = "";
      let quoted = false;

      const source = text.replace(/^\ufeff/, "");

      for (let index = 0; index < source.length; index++) {
        const character = source[index];

        if (quoted) {
          if (character === '"' && source[index + 1] === '"') {
            field += '"';
            index++;
          } else if (character === '"') {
            quoted = false;
          } else {
            field += character;
          }
        } else if (character === '"') {
          quoted = true;
        } else if (character === ",") {
          row.push(field);
          field = "";
        } else if (character === "\n") {
          row.push(field.replace(/\r$/, ""));
          rows.push(row);
          row = [];
          field = "";
        } else {
          field += character;
        }
      }

      row.push(field.replace(/\r$/, ""));
      if (row.some((value) => value !== "")) rows.push(row);

      return rows;
    }

    async function importCsv(file) {
      try {
        const text = await file.text();
        const rows = parseCsv(text);

        if (rows.length < 2) {
          throw new Error("CSVデータがありません");
        }

        const headers = rows[0];
        const dataRows = rows.slice(1).filter((row) => row.length > 1);

        const column = (name) => headers.indexOf(name);
        const required = [
          "record_id",
          "site_name",
          "operator",
          "method",
          "distance_m",
          "height_mm"
        ];

        if (required.some((name) => column(name) < 0)) {
          throw new Error("対応していないCSV形式です");
        }

        const first = dataRows[0];
        const value = (row, name) => row[column(name)] ?? "";

        const imported = blankState();

        imported.schema_version =
          value(first, "schema_version") || "1.0";
        imported.record_id =
          value(first, "record_id") || createRecordId();
        imported.site_name = value(first, "site_name");
        imported.operator = value(first, "operator");
        imported.record_date =
          value(first, "record_date") || todayString();
        imported.method =
          value(first, "method") || "勾配で計算";
        imported.top_width_m =
          numberOrNull(value(first, "top_width_m"));
        imported.bottom_width_m =
          numberOrNull(value(first, "bottom_width_m"));
        imported.front_slope =
          numberOrNull(value(first, "front_slope"));
        imported.rear_slope =
          numberOrNull(value(first, "rear_slope"));
        imported.notes = value(first, "notes");

        imported.points = dataRows.map((row) => ({
          distance_m: numberOrNull(value(row, "distance_m")),
          height_mm: numberOrNull(value(row, "height_mm"))
        })).filter((point) =>
          point.distance_m !== null &&
          point.height_mm !== null
        );

        state = imported;

        if (state.operator) {
          localStorage.setItem(OPERATOR_KEY, state.operator);
        }

        fillFormFromState();
        autoSave();
        renderAll();
        showTab("results");
        showMessage("CSVから案件を読み込みました", "success");
      } catch (error) {
        showMessage(error.message || "CSVを読み込めませんでした", "error");
      } finally {
        document.getElementById("csvFileInput").value = "";
      }
    }

    function showInstallGuide() {
      alert(
        "ホーム画面への追加方法\n\n" +
        "iPhone：Safari下部の共有ボタン →「ホーム画面に追加」\n\n" +
        "Android：Chrome右上のメニュー →「ホーム画面に追加」または「アプリをインストール」"
      );
    }

      let connectionCheckId = 0;

async function canAccessInternet() {
  if (!navigator.onLine) return false;

  const controller = new AbortController();
  const timeoutId = window.setTimeout(
    () => controller.abort(),
    4000
  );

  try {
    const response = await fetch(
      `./manifest.webmanifest?online-check=${Date.now()}`,
      {
        method: "HEAD",
        cache: "no-store",
        signal: controller.signal
      }
    );

    return response.ok;
  } catch (error) {
    return false;
  } finally {
    window.clearTimeout(timeoutId);
  }
}

async function updateConnectionStatus() {
  const checkId = ++connectionCheckId;
  const status = document.getElementById("connectionStatus");

  status.textContent = "確認中";
  status.style.background = "rgba(100,116,139,0.78)";

  const isOnline = await canAccessInternet();

  if (checkId !== connectionCheckId) return;

  if (isOnline) {
    status.textContent = "オンライン";
    status.style.background = "rgba(46,125,50,0.75)";
  } else {
    status.textContent = "オフライン";
    status.style.background = "rgba(198,40,40,0.78)";
  }
}

window.addEventListener("online", updateConnectionStatus);

});

if ("serviceWorker" in navigator) {
